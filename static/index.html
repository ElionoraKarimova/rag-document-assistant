<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            background: #0a0e1a;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.1), inset 0 0 20px rgba(56, 189, 248, 0.02);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(168, 85, 247, 0.3));
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding: 24px 28px;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 6px; }

        .mode-select {
            padding: 16px 28px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .mode-select .label-text { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .mode-btn {
            position: relative;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .chat {
            height: 420px;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 3px; }

        .msg {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            align-self: flex-end;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        }
        .msg.bot {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.15);
            color: #cbd5e1;
            align-self: flex-start;
        }
        .msg.bot .sources {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            opacity: 0.7;
        }
        .msg.loading { color: #64748b; font-style: italic; }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px 28px;
            border-top: 1px solid rgba(56, 189, 248, 0.1);
        }
        #question {
            flex: 1;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            font-size: 14px;
            color: #e2e8f0;
            outline: none;
            transition: all 0.3s;
        }
        #question::placeholder { color: #64748b; }
        #question:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
        }
        #send {
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        #send:hover { box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); transform: translateY(-1px); }
        #send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RAG Document Assistant</h1>
            <p>AI-powered answers grounded in your documents</p>
        </div>
        <div class="mode-select">
            <span class="label-text">Mode</span>
            <button class="mode-btn active" data-mode="rag" onclick="setMode(this)">RAG</button>
            <button class="mode-btn" data-mode="agent" onclick="setMode(this)">Agent</button>
        </div>
        <div class="chat" id="chat"></div>
        <div class="input-area">
            <input type="text" id="question" placeholder="Ask a question about your documents..." />
            <button id="send" onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("question");
        const sendBtn = document.getElementById("send");
        let currentMode = "rag";

        function setMode(btn) {
            document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentMode = btn.dataset.mode;
        }

        function addMessage(text, sender, sources) {
            const div = document.createElement("div");
            div.className = "msg " + sender;
            div.textContent = text;
            if (sources !== undefined && sources !== null) {
                const s = document.createElement("div");
                s.className = "sources";
                s.textContent = "Sources found: " + sources;
                div.appendChild(s);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, "user");
            input.value = "";
            sendBtn.disabled = true;

            const loadingMsg = addMessage("Thinking...", "bot");
            loadingMsg.classList.add("loading");

            try {
                const url = "/" + currentMode + "?question=" + encodeURIComponent(question);
                const response = await fetch(url);
                const data = await response.json();
                loadingMsg.remove();
                addMessage(data.answer, "bot", data.sources_found);
            } catch (error) {
                loadingMsg.remove();
                addMessage("Error: " + error.message, "bot");
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
